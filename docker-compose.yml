services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medoraai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./newwwchestmodel/chest_xray_rad_dino_model:/app/chest_model:ro
      - medoraai-data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-medoraai-hackathon-secret}
      - DATA_DIR=/app/data
      - CHEST_MODEL_PATH=/app/chest_model/rad_dino_chest_xray_classifier.pth
      - CHEST_MODEL_CACHE_DIR=/app/data/huggingface
      - CHEST_MODEL_LOCAL_FILES_ONLY=${CHEST_MODEL_LOCAL_FILES_ONLY:-false}
      - CHEST_DEVICE=${CHEST_DEVICE:-auto}
      - CHEST_PATHOLOGY_THRESHOLD=${CHEST_PATHOLOGY_THRESHOLD:-0.50}
      - CHEST_SECONDARY_THRESHOLD=${CHEST_SECONDARY_THRESHOLD:-0.35}
      - HF_TOKEN=${HF_TOKEN:-}
      - BRAIN_MODEL_PATH=/app/models/best_brain_model.keras
      - LUNG_MODEL_PATH=/app/models/cnn_lung_model.pth
      - KIDNEY_MODEL_PATH=/app/models/cnn_Kidney_Stone_model.pth
      - MAIRA_API_URL=${MAIRA_API_URL:-https://grass-quiet-icy.ngrok-free.dev}
      - MAIRA_TIMEOUT_SECONDS=${MAIRA_TIMEOUT_SECONDS:-120}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - SARVAM_TRANSLATE_MODEL=${SARVAM_TRANSLATE_MODEL:-sarvam-translate:v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - STRICT_SCAN_TYPE_VALIDATION=${STRICT_SCAN_TYPE_VALIDATION:-true}
      - SCAN_TYPE_VERIFIER_MODEL=${SCAN_TYPE_VERIFIER_MODEL:-}
      - SCAN_TYPE_GROQ_MODEL=${SCAN_TYPE_GROQ_MODEL:-qwen/qwen3.6-27b}
      - SCAN_TYPE_MIN_CONFIDENCE=${SCAN_TYPE_MIN_CONFIDENCE:-0.85}
      - DEMO_USER=${DEMO_USER:-demo}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-demo123}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medoraai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  medoraai-data:
    driver: local
